<html lang="en"><head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Signature – Emma Gumble</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    padding: 24px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background-color: #9aa0a6;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  /* OUTER CARD */
  .signature {
    background: #ffffff;
    width: 1180px;
    max-width: 100%;
    padding: 26px 30px;
    border-radius: 14px;
  }

  /* TOP ROW */
  .top-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }

  .name {
    font-size: 44px;
    font-weight: 600;
    color: #111111;
    letter-spacing: -1px;
    line-height: 1.05;
  }

  .title {
    font-size: 16px;
    color: #555555;
    margin-top: 8px;
    font-weight: 400;
  }

  .carma-logo { flex-shrink: 0; }
  .carma-logo img { height: 64px; display: block; }

  /* BOTTOM ROW */
  .bottom-row {
    display: flex;
    align-items: stretch;
    gap: 12px;
  }

  .box {
    background: #f5f5f7;
    border-radius: 12px;
  }

  .box-contact {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    padding: 18px 26px;
    gap: 0;
  }

  .col {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: #333333;
    white-space: nowrap;
  }

  /* clickable links keep the same look (no blue, no underline) */
  .contact-item a {
    color: inherit;
    text-decoration: none;
  }
  .contact-item a:hover { text-decoration: underline; }

  .contact-item .ico {
    width: 17px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #1a1a1a;
  }
  .contact-item .ico svg { display: block; }

  .box-sep {
    width: 1px;
    background: #d6d6d9;
    align-self: stretch;
    margin: 4px 26px;
  }

  .col-socials { margin-left: 38px; }

  .box-award {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 24px;
  }

  .box-award .art { flex-shrink: 0; display: flex; align-items: center; }
  .box-award .art.trophy img { height: 60px; display: block; }
  .box-award .art.world img  { height: 90px; display: block; }

  .award-text {
    
    font-family: 'Helvetica Neue', Helvetica, Arial;
    font-size: 15px;
    color: #555555;
    line-height: 1.35;
    white-space: nowrap;
  }
  .award-text strong {
    color: #111111;
    font-weight: 800;
  }

  /* Responsive */
  @media (max-width: 1180px) {
    .bottom-row { flex-wrap: wrap; }
    .box-contact { flex-basis: 100%; }
  }
  @media (max-width: 760px) {
    .top-row { flex-direction: row; }
    .name { font-size: 32px; }
    .box-contact { flex-wrap: wrap; gap: 16px 0; }
    .box-sep { display: none; }
    .col-socials { margin-left: 0; }
    .box-award { flex: 1 1 auto; }
  }
  @media (max-width: 480px) {
    .name { font-size: 26px; }
    .contact-item { font-size: 12.5px; white-space: normal; }
    .col { width: 100%; }
  }
</style>
</head>
<body>

    <!-- Box 2: AMEC award -->
    <div class="box box-award">
      <span class="art trophy"><img src="https://i.postimg.cc/vTKw51NG/trophy.png" alt="Award"></span>
    <p style="  font-family: 'Helvetica Neue', Helvetica, Arial; font-size: 14px; color: #1a1a1a; line-height: 1.25; letter-spacing: -0.01em;">
    <span style="font-weight: 400;  font-size: 20px;">Winners of</span><br>

    <!-- Box 3: World Cup -->
    <div class="box box-award">
      <span class="art world"><img src="https://i.postimg.cc/C52pbZQM/Worldcup.png" alt="World Cup"></span>
          <p style="  font-family: 'Helvetica Neue', Helvetica, Arial; font-size: 14px; color: #1a1a1a; line-height: 1.25; letter-spacing: -0.01em;">

</body></html>
